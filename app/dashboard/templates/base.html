<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Silent Whale{% endblock %}</title>
    <meta name="description" content="DeFi Alpha Signal Scanner — Real-time scoring dashboard for tokenless protocol discovery">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-primary: #0a0e17;
            --bg-secondary: #111827;
            --bg-card: #1a1f2e;
            --bg-card-hover: #222842;
            --border: #2a3144;
            --text-primary: #e5e7eb;
            --text-secondary: #9ca3af;
            --text-muted: #6b7280;
            --accent-blue: #3b82f6;
            --accent-purple: #8b5cf6;
            --accent-green: #10b981;
            --accent-yellow: #f59e0b;
            --accent-red: #ef4444;
            --accent-cyan: #06b6d4;
            --gradient-primary: linear-gradient(135deg, #3b82f6, #8b5cf6);
            --gradient-green: linear-gradient(135deg, #10b981, #06b6d4);
            --radius: 12px;
            --radius-sm: 8px;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
        }

        /* ─── NAV ─── */
        nav {
            background: rgba(17, 24, 39, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 0 2rem;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .nav-brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
            color: var(--text-primary);
            font-weight: 700;
            font-size: 1.125rem;
        }
        .nav-brand span { font-size: 1.5rem; }
        .nav-links { display: flex; gap: 1.5rem; }
        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 500;
            padding: 0.5rem 1rem;
            border-radius: var(--radius-sm);
            transition: all 0.2s;
        }
        .nav-links a:hover, .nav-links a.active {
            color: var(--text-primary);
            background: rgba(59, 130, 246, 0.1);
        }

        /* ─── LAYOUT ─── */
        .container { max-width: 1280px; margin: 0 auto; padding: 2rem; }
        .page-header { margin-bottom: 2rem; }
        .page-header h1 {
            font-size: 1.75rem;
            font-weight: 700;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .page-header p { color: var(--text-secondary); margin-top: 0.25rem; }

        /* ─── STATS ROW ─── */
        .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.25rem;
            transition: transform 0.2s, border-color 0.2s;
        }
        .stat-card:hover { transform: translateY(-2px); border-color: var(--accent-blue); }
        .stat-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); font-weight: 600; }
        .stat-value { font-size: 1.75rem; font-weight: 700; margin-top: 0.25rem; }
        .stat-value.blue { color: var(--accent-blue); }
        .stat-value.green { color: var(--accent-green); }
        .stat-value.yellow { color: var(--accent-yellow); }
        .stat-value.purple { color: var(--accent-purple); }

        /* ─── TABLE ─── */
        .table-container {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
        }
        table { width: 100%; border-collapse: collapse; }
        th {
            text-align: left;
            padding: 0.875rem 1.25rem;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            font-weight: 600;
            border-bottom: 1px solid var(--border);
            background: rgba(0, 0, 0, 0.2);
            cursor: pointer;
            user-select: none;
        }
        th:hover { color: var(--accent-blue); }
        td {
            padding: 0.875rem 1.25rem;
            font-size: 0.875rem;
            border-bottom: 1px solid rgba(42, 49, 68, 0.5);
        }
        tr { transition: background 0.15s; }
        tr:hover { background: var(--bg-card-hover); }
        tr:last-child td { border-bottom: none; }

        /* ─── BADGES ─── */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            padding: 0.25rem 0.625rem;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .badge-hot { background: rgba(239, 68, 68, 0.15); color: var(--accent-red); }
        .badge-warm { background: rgba(245, 158, 11, 0.15); color: var(--accent-yellow); }
        .badge-cool { background: rgba(107, 114, 128, 0.15); color: var(--text-muted); }
        .badge-healthy { background: rgba(16, 185, 129, 0.15); color: var(--accent-green); }
        .badge-unhealthy { background: rgba(239, 68, 68, 0.15); color: var(--accent-red); }

        /* ─── SCORE BAR ─── */
        .score-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 3px;
            overflow: hidden;
            margin-top: 0.375rem;
        }
        .score-bar-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.6s ease;
        }
        .score-bar-fill.hot { background: var(--gradient-primary); }
        .score-bar-fill.warm { background: linear-gradient(90deg, var(--accent-yellow), var(--accent-red)); }
        .score-bar-fill.cool { background: rgba(107, 114, 128, 0.4); }

        /* ─── LINKS ─── */
        a.project-link {
            color: var(--accent-blue);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }
        a.project-link:hover { color: var(--accent-cyan); text-decoration: underline; }

        /* ─── CHART ─── */
        .chart-container {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }
        .chart-container h3 {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: var(--text-secondary);
        }

        /* ─── GRID ─── */
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
        @media (max-width: 768px) { .grid-2 { grid-template-columns: 1fr; } }

        /* ─── CHAIN PILLS ─── */
        .chain-pills { display: flex; flex-wrap: wrap; gap: 0.375rem; }
        .chain-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            padding: 0.25rem 0.5rem;
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.2);
            border-radius: 999px;
            font-size: 0.6875rem;
            font-weight: 500;
            color: var(--accent-blue);
        }
        .chain-pill .tvl {
            color: var(--text-muted);
            font-weight: 400;
        }

        /* ─── DETAIL SECTIONS ─── */
        .section { margin-bottom: 2rem; }
        .section h2 { font-size: 1.25rem; font-weight: 600; margin-bottom: 1rem; }

        /* ─── EMPTY STATE ─── */
        .empty-state {
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
        }
        .empty-state span { font-size: 3rem; display: block; margin-bottom: 1rem; }

        /* ─── RESPONSIVE ─── */
        @media (max-width: 640px) {
            .container { padding: 1rem; }
            nav { padding: 0 1rem; }
            .stats-row { grid-template-columns: 1fr 1fr; }
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <nav>
        <a href="/" class="nav-brand">
            <span>🐋</span> Silent Whale
        </a>
        <div class="nav-links">
            <a href="/" {% if request.url.path == "/" %}class="active"{% endif %}>Leaderboard</a>
            <a href="/health-status" {% if request.url.path == "/health-status" %}class="active"{% endif %}>Health</a>
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    {% block scripts %}{% endblock %}
</body>
</html>
